[workspace]
resolver = "3"
members = ["crates/emu-core", "apps/its-emu", "crates/stm32f429", "apps/its-emu-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
emu-core = { path = "crates/emu-core" }
stm32f429 = { path = "crates/stm32f429" }
itsboard = { path = "crates/itsboard" }
# only the Arm guest (the default builds all ten architectures)
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_arm"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
png = "0.18"
gdbstub = "0.7"

[profile.release]
debug = 1

# Debug info only for the own crates: that of the dependencies (Unicorn's C
# code, the GUI stack) made up most of the binaries and the build directory;
# without it Unicorn is also built as Release (-O3) instead of RelWithDebInfo.
[profile.release.package."*"]
debug = false

# Debug builds (`cargo run` without --release): Unicorn unoptimized makes the
# emulator several times slower than real time.
[profile.dev.package."*"]
opt-level = 3
debug = false

# The emulator's hot paths (hooks, peripherals): basic optimizations keep
# debug builds usable and still debuggable.
[profile.dev.package.emu-core]
opt-level = 1
[profile.dev.package.stm32f429]
opt-level = 1
[profile.dev.package.itsboard]
opt-level = 1
