[workspace]
resolver = "3"
members = ["crates/emu-core", "apps/its-emu", "crates/stm32f429", "apps/its-emu-gui", "crates/usbip", "crates/stlink"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
emu-core = { path = "crates/emu-core" }
stm32f429 = { path = "crates/stm32f429" }
itsboard = { path = "crates/itsboard" }
usbip = { path = "crates/usbip" }
stlink = { path = "crates/stlink" }
# only the Arm guest (the default builds all ten architectures)
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_arm"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
# without the regex filters (RUST_LOG=target/regex), which made up 0.6 MB of the binaries
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
clap = { version = "4", features = ["derive"] }
png = "0.18"
gdbstub = "0.7"

[profile.release]
debug = 1

# Debug info only for the own crates: that of the dependencies (Unicorn's C
# code, the GUI stack) made up most of the binaries and the build directory;
# without it Unicorn is also built as Release (-O3) instead of RelWithDebInfo.
[profile.release.package."*"]
debug = false

# Packages (packaging/arch): link-time optimization over all crates makes the
# binaries about a quarter smaller, at the cost of a longer build. Measured
# speed: ~10 % faster with idle-loop skipping, within a few percent either way
# without it; identical results. A panic aborts: the emulator runs in Unicorn's
# callbacks, which cannot unwind anyway.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true
panic = "abort"

# Debug builds (`cargo run` without --release): Unicorn unoptimized makes the
# emulator several times slower than real time.
[profile.dev.package."*"]
opt-level = 3
debug = false

# The emulator's hot paths (hooks, peripherals): basic optimizations keep
# debug builds usable and still debuggable.
[profile.dev.package.emu-core]
opt-level = 1
[profile.dev.package.stm32f429]
opt-level = 1
[profile.dev.package.itsboard]
opt-level = 1

# Unicorn with patches for speed (vendor/README.md)
[patch.crates-io]
unicorn-engine-sys = { path = "vendor/unicorn-engine-sys" }
