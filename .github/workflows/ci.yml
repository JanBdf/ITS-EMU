name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Unicorn has not been tried on Windows on Arm yet.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, experimental: false }
          - { name: linux-arm64, os: ubuntu-24.04-arm, experimental: false }
          - { name: windows-x64, os: windows-2025, experimental: false }
          - { name: windows-arm64, os: windows-11-arm, experimental: true }
          - { name: macos-arm64, os: macos-15, experimental: false }
          - { name: macos-x64, os: macos-15-intel, experimental: false }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # The GDB server tests need a GDB that knows Arm; they skip without one.
      - name: Install GDB
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdb-multiarch

      # Release mode: the emulator tests run seconds of virtual time.
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Test
        run: cargo test --release --workspace --locked

      - name: Throughput
        shell: bash
        run: |
          {
            echo "### Throughput on ${{ matrix.name }}"
            echo '```'
            echo "bench.elf (compute phase, then MMIO polling phase):"
            target/release/its-emu tests/fixtures/micro/bench.elf --no-fonts --continue-on-bkpt --seconds 30 2>/dev/null | grep MIPS
            echo "TestNewFont.axf (5 s virtual, display output):"
            target/release/its-emu tests/fixtures/ac6/TestNewFont.axf --seconds 5 2>/dev/null | grep MIPS
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: its-emu-${{ matrix.name }}
          path: |
            target/release/its-emu
            target/release/its-emu-gui
            target/release/its-emu.exe
            target/release/its-emu-gui.exe
          if-no-files-found: error
          retention-days: 14
