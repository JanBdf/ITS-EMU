name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Unicorn's MSVC build only knows x86 hosts (it hard-codes __x86_64__, the
    # i386 TCG backend and an x64 MASM setjmp wrapper), so Windows on Arm builds
    # the x64 binaries and runs them under the system's x64 emulation.
    continue-on-error: ${{ matrix.experimental }}
    env:
      TARGET: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      BIN: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, experimental: false }
          - { name: linux-arm64, os: ubuntu-24.04-arm, experimental: false }
          - { name: windows-x64, os: windows-2025, experimental: false }
          - { name: windows-arm64, os: windows-11-arm, experimental: true, target: x86_64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-15, experimental: false }
          - { name: macos-x64, os: macos-15-intel, experimental: false }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # The GDB server tests need a GDB that knows Arm; they skip without one.
      - name: Install GDB
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdb-multiarch

      # Release mode: the emulator tests run seconds of virtual time.
      - name: Build
        run: cargo build --release --workspace --locked ${{ env.TARGET }}
      - name: Test
        run: cargo test --release --workspace --locked ${{ env.TARGET }}

      # The GUI starts and draws a frame (Xvfb, Mesa's software rendering; wgpu
      # falls back to OpenGL without a Vulkan driver): start-up and renderer
      # problems that the tests do not see.
      - name: GUI smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0
          ITS_EMU_GUI_SCREENSHOT=gui.png:3 timeout 120 xvfb-run -a $BIN/its-emu-gui --no-gdb --no-usb tests/fixtures/micro/bench.elf
          test -s gui.png

      - name: Throughput
        shell: bash
        run: |
          {
            echo "### Throughput on ${{ matrix.name }}"
            echo '```'
            echo "bench.elf (compute phase, then MMIO polling phase):"
            $BIN/its-emu tests/fixtures/micro/bench.elf --no-fonts --continue-on-bkpt --seconds 30 2>/dev/null | grep MIPS
            echo "TestNewFont.axf (5 s virtual, display output):"
            $BIN/its-emu tests/fixtures/ac6/TestNewFont.axf --seconds 5 2>/dev/null | grep MIPS
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: its-emu-${{ matrix.name }}
          path: |
            ${{ env.BIN }}/its-emu
            ${{ env.BIN }}/its-emu-gui
            ${{ env.BIN }}/its-emu.exe
            ${{ env.BIN }}/its-emu-gui.exe
          if-no-files-found: error
          retention-days: 14
