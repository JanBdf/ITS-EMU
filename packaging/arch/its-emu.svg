<?xml version="1.0" encoding="UTF-8"?>
<!-- ITS-Board emulator icon: the blue carrier board with display, LEDs and buttons -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="6" y="18" width="116" height="92" rx="10" fill="#1d3b6e"/>
  <rect x="6" y="18" width="116" height="92" rx="10" fill="none" stroke="#5c7fb8" stroke-width="2"/>
  <!-- Nucleo with display -->
  <rect x="34" y="26" width="60" height="44" rx="3" fill="#f2f2f2"/>
  <rect x="46" y="30" width="44" height="34" rx="2" fill="#141414"/>
  <rect x="49" y="33" width="38" height="28" fill="#e9eef5"/>
  <text x="68" y="51" font-family="monospace" font-size="9" text-anchor="middle" fill="#1d3b6e">ITS</text>
  <rect x="38" y="40" width="5" height="10" fill="#202020"/>
  <!-- LEDs -->
  <g fill="#ffcf4a">
    <circle cx="20" cy="82" r="3.5"/><circle cx="30" cy="82" r="3.5"/><circle cx="40" cy="82" r="3.5"/>
    <circle cx="50" cy="82" r="3.5"/>
  </g>
  <g fill="#6b5a2a">
    <circle cx="60" cy="82" r="3.5"/><circle cx="70" cy="82" r="3.5"/>
  </g>
  <g fill="#ff3b3b">
    <circle cx="86" cy="82" r="3.5"/><circle cx="96" cy="82" r="3.5"/><circle cx="106" cy="82" r="3.5"/>
  </g>
  <!-- buttons -->
  <g fill="#e9e9e9" stroke="#b03030" stroke-width="1.5">
    <rect x="82" y="92" width="9" height="9" rx="2"/><rect x="95" y="92" width="9" height="9" rx="2"/>
    <rect x="108" y="92" width="9" height="9" rx="2" transform="translate(-3 0)"/>
  </g>
  <!-- header pins -->
  <g fill="#c9a640">
    <circle cx="18" cy="98" r="2.2"/><circle cx="26" cy="98" r="2.2"/><circle cx="34" cy="98" r="2.2"/>
    <circle cx="42" cy="98" r="2.2"/><circle cx="50" cy="98" r="2.2"/><circle cx="58" cy="98" r="2.2"/>
  </g>
</svg>
